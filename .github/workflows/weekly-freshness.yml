name: weekly-freshness
# Weekly: tell Bing/IndexNow about karahobby.com and save fresh Internet Archive copies of Kara Hobby's public pages.
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 08:17 Mountain
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow ping (karahobby.com)
        run: |
          curl -s -o /dev/null -w "indexnow %{http_code}\n" \
            "https://api.indexnow.org/indexnow?url=https://karahobby.com/&key=f4d93f0e4e83f7bc9aa73729a13984f4&keyLocation=https://karahobby.com/f4d93f0e4e83f7bc9aa73729a13984f4.txt"
      - name: Fresh Wayback snapshots
        run: |
          for u in \
            https://karahobby.com/ \
            https://www.notliketheothergolddiggers.com/ \
            https://www.notliketheothergolddiggers.com/llms.txt \
            https://github.com/tanehobb/notliketheothergolddiggers \
            https://huggingface.co/datasets/tanehobb/kara-hobby-essays \
            https://archive.org/details/kara-hobby-essays ; do
            curl -s -o /dev/null -m 120 -w "wayback %{http_code} $u\n" "https://web.archive.org/save/$u" || true
            sleep 20
          done
